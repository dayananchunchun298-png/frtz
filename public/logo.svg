<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="catGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8e7d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="#ffffff"/>
  
  <!-- Dark blue arch -->
  <path d="M 50 140 Q 200 40 350 140 L 350 170 L 50 170 Z" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="3"/>
  
  <!-- Dog silhouette (left side, behind cat) -->
  <g transform="translate(130, 125)">
    <!-- Dog head and body -->
    <path d="M 0 25 Q -20 20 -25 10 Q -20 0 -15 0 Q -10 -5 0 -3 Q 10 -5 15 0 Q 20 0 25 10 Q 20 20 0 25 Z" fill="#1e3a8a"/>
    <!-- Dog ear -->
    <path d="M -10 -3 Q -15 -10 -12 -15 Q -8 -12 -10 -3" fill="#1e3a8a"/>
    <!-- Dog eye (white circle) -->
    <circle cx="-8" cy="-2" r="3" fill="#ffffff"/>
    <!-- Dog mouth (smile) -->
    <path d="M -12 8 Q -6 12 0 8" stroke="#1e3a8a" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Cat silhouette (right side, in front of dog) -->
  <g transform="translate(270, 115)">
    <!-- Cat head and body -->
    <path d="M 0 25 Q -20 20 -25 10 Q -20 0 -15 0 Q -10 -5 0 -3 Q 10 -5 15 0 Q 20 0 25 10 Q 20 20 0 25 Z" fill="url(#catGradient)"/>
    <!-- Cat ears -->
    <path d="M -12 -12 L -6 -20 L 0 -12" fill="url(#catGradient)"/>
    <path d="M 0 -12 L 6 -20 L 12 -12" fill="url(#catGradient)"/>
    <!-- Cat eyes (black dots) -->
    <circle cx="-8" cy="-2" r="2" fill="#000000"/>
    <circle cx="8" cy="-2" r="2" fill="#000000"/>
    <!-- Cat mouth (smile) -->
    <path d="M -2 5 Q 0 8 2 5" stroke="#000000" stroke-width="2" fill="none"/>
    <!-- Cat whiskers -->
    <line x1="-15" y1="0" x2="-22" y2="-3" stroke="#000000" stroke-width="1.5"/>
    <line x1="-15" y1="3" x2="-22" y2="6" stroke="#000000" stroke-width="1.5"/>
    <line x1="15" y1="0" x2="22" y2="-3" stroke="#000000" stroke-width="1.5"/>
    <line x1="15" y1="3" x2="22" y2="6" stroke="#000000" stroke-width="1.5"/>
  </g>
  
  <!-- Text: FRTZ PAWCARE with space between words -->
  <text x="140" y="190" text-anchor="start" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="1px">FRTZ</text>
  <text x="260" y="190" text-anchor="start" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="22" font-weight="bold" letter-spacing="1px">PAWCARE</text>
</svg>
